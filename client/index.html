<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPI Sentinel — Detect UPI Scams Before You Pay</title>
    <meta name="description" content="Intelligent UPI Scam Detection & Risk Analysis System. Analyze messages, URLs, QR codes, and transaction contexts." />
    <!-- Immediate theme resolution script to prevent theme flash -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('upi-sentinel-theme');
          var isDark = false;
          if (savedTheme === 'dark') {
            isDark = true;
          } else if (savedTheme === 'light') {
            isDark = false;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
